openapi: 3.0.3
info:
  title: Investhub API
  version: 1.0.0
  description: "Supabase Edge Functions for Investhub. Call via POST to /functions/v1/{name} with JSON body. Auth: Bearer <privy_access_token> for protected endpoints. Use the API Reference in this documentation to browse and try endpoints interactively."

servers:
  - url: https://{project}.supabase.co/functions/v1
    variables:
      project:
        default: your-project-ref
        description: Supabase project reference

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Privy access token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

paths:
  /get-profile:
    post:
      operationId: get_profile
      summary: Get current user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: See Edge Function source for exact request shape (e.g. interface XxxRequest in index.ts)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

